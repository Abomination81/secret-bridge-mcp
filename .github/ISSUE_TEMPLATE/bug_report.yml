name: Bug report
description: Report a reproducible SecretBridge problem using dummy values only.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Never include a real credential, .env contents, Keychain export, or Credential Manager export."
  - type: input
    id: version
    attributes:
      label: SecretBridge version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows 11
        - Other
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI client
      placeholder: Codex, Claude Code, Gemini CLI, or another MCP host
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a dummy value such as example-not-a-real-secret.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and non-secret error text
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Safety confirmation
      options:
        - label: I have removed all real credentials and secret values from this report.
          required: true
