name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: x86_64-apple-darwin
            archive: secret-bridge-mcp-macos-intel
          - os: macos-14
            target: aarch64-apple-darwin
            archive: secret-bridge-mcp-macos-apple-silicon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: secret-bridge-mcp-windows-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - run: rustup target add '${{ matrix.target }}'
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Package macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.archive }}"
          cp "target/${{ matrix.target }}/release/secret-bridge-mcp" "dist/${{ matrix.archive }}/"
          cp README.md LICENSE "dist/${{ matrix.archive }}/"
          tar -C dist -czf "dist/${{ matrix.archive }}.tar.gz" "${{ matrix.archive }}"
          shasum -a 256 "dist/${{ matrix.archive }}.tar.gz" > "dist/${{ matrix.archive }}.tar.gz.sha256"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Join-Path "dist" "${{ matrix.archive }}"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\secret-bridge-mcp.exe" $package
          Copy-Item "README.md", "LICENSE" $package
          $archive = "dist\${{ matrix.archive }}.zip"
          Compress-Archive -Path "$package\*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  ${{ matrix.archive }}.zip" | Out-File "$archive.sha256" -Encoding ascii
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/${{ matrix.archive }}.*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "SecretBridge MCP ${GITHUB_REF_NAME}"
