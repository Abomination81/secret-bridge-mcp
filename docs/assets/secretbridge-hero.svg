<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">SecretBridge MCP by Abomination81</title>
  <desc id="desc">A black and neon green banner showing a secret moving from a native popup to an operating system vault and environment file without entering AI chat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020704"/>
      <stop offset="1" stop-color="#08110a"/>
    </linearGradient>
    <radialGradient id="halo" cx="18%" cy="20%" r="75%">
      <stop offset="0" stop-color="#39ff14" stop-opacity=".16"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#39ff14" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="560" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="560" rx="30" fill="url(#halo)"/>
  <rect width="1400" height="560" rx="30" fill="url(#grid)"/>
  <rect x="2" y="2" width="1396" height="556" rx="28" fill="none" stroke="#235c2b" stroke-width="4"/>

  <g transform="translate(74 68)">
    <rect width="92" height="92" rx="22" fill="#020704" stroke="#39ff14" stroke-width="3"/>
    <g fill="none" stroke="#39ff14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" transform="translate(13 13) scale(.52)">
      <path d="M25 75V55M103 75V55M25 60c19-31 59-31 78 0" stroke-width="7"/>
      <path d="M18 78h92M38 78v18M90 78v18" stroke-width="6"/>
      <rect x="49" y="61" width="30" height="28" rx="7" fill="#061008" stroke-width="4"/>
      <path d="M56 61v-7a8 8 0 0 1 16 0v7" stroke-width="4"/>
      <circle cx="64" cy="74" r="3.8" fill="#39ff14" stroke="none"/>
    </g>
    <text x="120" y="38" fill="#39ff14" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="800" letter-spacing="3">LOCAL MCP SECRET BROKER</text>
    <text x="120" y="73" fill="#b7ffa8" font-family="Inter, Arial, sans-serif" font-size="18">Built by Abomination81</text>

    <text x="0" y="184" fill="#f4f7f4" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="850" letter-spacing="-2">Paste secrets into a popup.</text>
    <text x="0" y="254" fill="#39ff14" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="850" letter-spacing="-2">Not your AI chat.</text>
    <text x="2" y="310" fill="#b8c3ba" font-family="Inter, Arial, sans-serif" font-size="23">Native entry. OS storage. Reusable credentials. Direct .env writing.</text>

    <g transform="translate(0 354)">
      <rect width="180" height="48" rx="24" fill="#39ff14"/>
      <text x="90" y="31" text-anchor="middle" fill="#031004" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">OPEN SOURCE</text>
      <rect x="196" width="160" height="48" rx="24" fill="#071008" stroke="#39ff14"/>
      <text x="276" y="31" text-anchor="middle" fill="#39ff14" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">MAC + WINDOWS</text>
      <rect x="372" width="126" height="48" rx="24" fill="#071008" stroke="#39ff14"/>
      <text x="435" y="31" text-anchor="middle" fill="#39ff14" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">NO CLOUD</text>
    </g>
  </g>

  <g transform="translate(975 74)">
    <rect width="350" height="410" rx="28" fill="#08110a" stroke="#235c2b" stroke-width="2"/>
    <circle cx="28" cy="27" r="5" fill="#39ff14"/>
    <text x="44" y="33" fill="#b7ffa8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">SECRETBRIDGE</text>
    <text x="28" y="83" fill="#f4f7f4" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Secure secret entry</text>
    <text x="28" y="108" fill="#748776" font-family="Inter, Arial, sans-serif" font-size="12">The value stays out of AI messages</text>
    <text x="28" y="151" fill="#748776" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="800">SECRET</text>
    <text x="28" y="178" fill="#f4f7f4" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Polymarket API credential</text>
    <rect x="28" y="200" width="294" height="54" rx="12" fill="#050805" stroke="#235c2b"/>
    <text x="46" y="234" fill="#b8c3ba" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="5">••••••••••••••</text>
    <circle cx="34" cy="283" r="4" fill="#39ff14"/>
    <text x="48" y="287" fill="#b8c3ba" font-family="Inter, Arial, sans-serif" font-size="11">Will be stored in the operating-system vault</text>
    <rect x="28" y="316" width="294" height="52" rx="12" fill="#39ff14"/>
    <text x="175" y="348" text-anchor="middle" fill="#031004" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="850">STORE SECRET SECURELY</text>
    <text x="175" y="394" text-anchor="middle" fill="#748776" font-family="Inter, Arial, sans-serif" font-size="10">Built by Abomination81 · X @Abomination81</text>
  </g>
</svg>
