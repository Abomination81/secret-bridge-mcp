[package]
name = "secret-bridge-mcp"
version = "0.3.0"
edition = "2024"
autobins = false
description = "A local MCP secret broker that keeps secret values out of model context"
authors = ["Abomination81"]
license = "MIT"
rust-version = "1.93"
repository = "https://github.com/abomination81/secret-bridge-mcp"
homepage = "https://github.com/abomination81/secret-bridge-mcp"
readme = "README.md"
keywords = ["mcp", "secrets", "keychain", "dotenv", "ai"]
categories = ["development-tools"]
publish = false

[[bin]]
name = "secret-bridge-mcp"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
fs2 = "0.4.3"
keyring = "4.1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }
zeroize = "1.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSObject", "NSNotification", "NSURL", "NSArray"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSAppearance", "NSButton", "NSControl", "NSTextField", "NSSecureTextField", "NSText", "NSFont", "NSColor", "NSImage", "NSView", "NSWindow", "NSResponder", "NSPathControl", "NSPathCell", "NSCell", "NSPasteboard", "NSBox", "NSScrollView", "NSClipView", "NSFontDescriptor", "NSTextFieldCell", "NSLayoutConstraint", "NSMenu", "NSMenuItem", "NSParagraphStyle", "NSScroller", "NSScreen"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.21"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
